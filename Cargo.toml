[package]
name = "incident-fingerprint-preview"
version = "0.1.0"
edition = "2024"
description = "Offline what-if evaluator for incident fingerprint rules"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-incident-fingerprint-preview"
readme = "README.md"
keywords = ["sentry", "incident", "fingerprint", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["site/", ".factory/", ".github/"]

[lib]
name = "incident_fingerprint_preview"

[[bin]]
name = "fingerprint-preview"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.47", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3.21.0"
